# M3-B transition-neighborhood audit: Bonn placing_box3.
inherit_from: "configs/rgbd/bonn/config.yaml"

Dataset:
  dataset_path: "datasets/bonn/rgbd_bonn_placing_nonobstructing_box3"

Training:
  single_thread: true
  dystart: 348

Uncertainty:
  enable_m1: true
  enable_m2a: true
  m2a_use_diag_calibration: false
  enable_m2a2: false
  m1_mapping_weighting: false
  m3_jackknife_audit: false
  m3b_flow_perturbation_audit: true
  m3b_min_pixels: 500
  m3b_frame_range: [318, 378]
