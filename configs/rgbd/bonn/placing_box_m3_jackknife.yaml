# M3-A transition-neighborhood audit: Bonn placing_box.
# Behavior-neutral spatial delete-block pose-instability diagnostics.
inherit_from: "configs/rgbd/bonn/config.yaml"

Dataset:
  dataset_path: "datasets/bonn/rgbd_bonn_placing_nonobstructing_box"

Training:
  single_thread: true
  dystart: 241

Uncertainty:
  enable_m1: true
  # M2-A remains shadow-only here solely to save T_final/T_motion_prior for
  # the matched relative-pose audit. No calibrated absolute covariance or
  # tracking posterior is used by M3-A.
  enable_m2a: true
  m2a_use_diag_calibration: false
  enable_m2a2: false
  m1_mapping_weighting: false
  m3_jackknife_audit: true
  m3_jackknife_grid_rows: 4
  m3_jackknife_grid_cols: 4
  m3_jackknife_min_train_pixels: 1000
  m3_jackknife_min_removed_pixels: 50
  m3_jackknife_robust_iters: 30
  m3_jackknife_frame_range: [211, 271]
